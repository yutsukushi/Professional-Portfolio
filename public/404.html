<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      const l = window.location
      const base = '/Professional-Portfolio/'
      l.replace(
        l.origin
          + base
          + '?/'
          + l.pathname.slice(base.length).replace(/&/g, '~and~')
          + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '')
          + l.hash
      )
    </script>
  </head>
</html>
